version = 1

# Java files carry their own SPDX headers. This file marks everything that
# can't hold one.

[[annotations]]
path = [
    "**/*.gradle",
    "**/gradle.properties",
    ".gitignore",
    ".gitattributes",
    ".claude/settings.json",
    ".claude/hooks/*.sh",
    ".gitmodules",
    "**/*.mods.toml",
    "**/*.md",
    "**/src/main/resources/**/*.json",
    "**/src/gametest/resources/**/*.json",
    "**/src/main/resources/**/*.png",
    "**/src/main/resources/**/*.mcmeta",
    "**/src/main/resources/**/*.mcfunction",
    "**/src/gametest/resources/**/*.mcmeta",
    "**/src/gametest/resources/**/*.mcfunction",
    "**/src/gametest/resources/**/*.nbt",
    "**/src/main/resources/**/*.nbt",
    "LICENSE",
    "NOTICE",
    ".github/**",
]
SPDX-FileCopyrightText = "2026 5thlayer"
SPDX-License-Identifier = "MIT"

# Malcolm Riley's unused textures (https://github.com/malcolmriley/unused-textures), credited in
# NOTICE. The unmodified copies under data/art/, and the textures scripts/build-textures.py writes
# from them unchanged, are his; a texture it draws on them is both his and ours. Module CI runs that
# script's --check.
[[annotations]]
path = [
    "data/art/*.png",
    "src/main/resources/assets/railworks/textures/block/station/front.png",
    "src/main/resources/assets/railworks/textures/block/station/side.png",
    "src/main/resources/assets/railworks/textures/block/rail/*.png",
    "src/main/resources/assets/railworks/textures/block/pylon/*.png",
    "src/main/resources/assets/railworks/textures/block/steel.png",
]
precedence = "override"
SPDX-FileCopyrightText = "Malcolm Riley"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["src/main/resources/assets/railworks/textures/block/station/top.png"]
precedence = "override"
SPDX-FileCopyrightText = ["Malcolm Riley", "2026 5thlayer"]
SPDX-License-Identifier = "CC-BY-4.0"

# The Gradle wrapper is Gradle's.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle"
SPDX-License-Identifier = "Apache-2.0"
