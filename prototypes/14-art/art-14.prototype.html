<!doctype html>
<!-- PROTOTYPE for 5thlayer/railworks#14, throwaway. Model × look × texel density for every car, the
     Pylon and Rail, and the blocks, switchable from the bottom bar and the URL (?focus=&geo=&look=&px=).
     Built by build.py, which inlines the textures. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Railworks Art Prototype</title>
<style>
  :root { --bar: rgba(20,22,26,.86); --ink: #f1f1f1; --dim: #9aa0a8; --sky: #9fc8ef; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); font: 13px/1.2 system-ui, sans-serif; }
  canvas { display: block; }
  #bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px;
         background: var(--bar); color: var(--ink); border-radius: 999px; padding: 5px 8px;
         box-shadow: 0 4px 18px rgba(0,0,0,.3); user-select: none; max-width: calc(100vw - 32px); flex-wrap: wrap; justify-content: center; }
  .grp { display: flex; align-items: center; gap: 2px; }
  .grp button { all: unset; cursor: pointer; padding: 3px 7px; border-radius: 999px; color: var(--dim); }
  .grp button:hover { color: var(--ink); background: rgba(255,255,255,.08); }
  .grp span { min-width: 72px; text-align: center; white-space: nowrap; }
  .sep { width: 1px; background: rgba(255,255,255,.15); margin: 3px 2px; }
  #px { cursor: pointer; padding: 3px 8px; border-radius: 999px; color: var(--ink); background: rgba(255,255,255,.1); }
  #help { position: fixed; right: 12px; top: 12px; background: var(--bar); color: var(--ink); border-radius: 10px;
          padding: 8px 12px; display: none; line-height: 1.6; }
  #help kbd { color: #ffd37a; font: inherit; }
  #q { position: fixed; right: 12px; top: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--bar);
       color: var(--dim); display: grid; place-items: center; cursor: pointer; }
  #credit { position: fixed; left: 10px; bottom: 6px; color: rgba(0,0,0,.45); font-size: 10px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }
</script>
</head>

</div>

// ---------------------------------------------------------------- textures
const loader = new THREE.TextureLoader();
const texCache = new Map();
const animated = [];
function texture(key) {
  if (texCache.has(key)) return texCache.get(key);
  const t = new THREE.Texture();
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  const img = new Image();
  img.onload = () => {
    if (img.height > img.width) { // an animation strip: draw its frames into a canvas in turn
      const c = document.createElement('canvas'); c.width = c.height = img.width;
      const anim = { img, c, ctx: c.getContext('2d'), frames: img.height / img.width, t };
      animated.push(anim); t.image = c; drawFrame(anim, 0);
    } else { t.image = img; }
    t.needsUpdate = true;
  };
  img.src = TEX[key];
  texCache.set(key, t);
  return t;
}
function drawFrame(a, i) {
  const s = a.img.width; a.ctx.clearRect(0, 0, s, s);
  a.ctx.drawImage(a.img, 0, (i % a.frames) * s, s, s, 0, 0, s, s); a.t.needsUpdate = true;
}

const matCache = new Map();
function material(spec, density) {
  const key = JSON.stringify(spec) + density;
  if (matCache.has(key)) return matCache.get(key);
  let m;
  if (Array.isArray(spec)) m = new THREE.MeshBasicMaterial({ color: new THREE.Color(...spec).convertSRGBToLinear(), vertexColors: true });
  else if (spec.flat) m = new THREE.MeshBasicMaterial({ color: new THREE.Color(...spec.flat).convertSRGBToLinear(), vertexColors: !spec.glow });
  else m = new THREE.MeshBasicMaterial({ map: texture(spec.tex), color: spec.tint ?? 0xffffff, vertexColors: !spec.glow, alphaTest: .5 });
  matCache.set(key, m);
  return m;
}

// A box [x0,y0,z0,x1,y1,z1] with Minecraft's face shading and UVs taken from its own coordinates
// (scale texels per block / 16), or the whole texture on each face (fit).
function boxGeometry(b, { scale = 1, fit = false, off = [0, 0, 0] } = {}) {
  const [x0, y0, z0, x1, y1, z1] = b;
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  const pos = g.attributes.position, nor = g.attributes.normal, uv = g.attributes.uv;
  const col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const nx = nor.getX(i), ny = nor.getY(i), nz = nor.getZ(i);
    const x = pos.getX(i) + off[0], y = pos.getY(i) + off[1], z = pos.getZ(i) + off[2];
    if (!fit) {
      let u, v;
      if (Math.abs(nx) > .5) { u = nx > 0 ? -z : z; v = y; }
      else if (Math.abs(nz) > .5) { u = nz > 0 ? x : -x; v = y; }
      else { u = x; v = -z; }
      uv.setXY(i, u * scale, v * scale);
    }
    const s = ny > .5 ? 1 : ny < -.5 ? .5 : Math.abs(nz) > .5 ? .8 : .6;
    col.set([s, s, s], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}

function meshOf(part, look, density, off) {
  const spec = look[part.role] ?? look.SHELL;
  const fit = part.fit ?? (!Array.isArray(spec) && spec.fit);
  const g = boxGeometry(part.box, { scale: density / 16, fit, off });
  if (part.top) {
    const top = look[part.top];
    const mats = [0, 1, 2, 3, 4, 5].map(i => material(i === 2 ? top : spec, density));
    return new THREE.Mesh(g, mats);
  }
  return new THREE.Mesh(g, material(spec, density));
}

// ---------------------------------------------------------------- cars, after CarBody.java
const GAP = .2, LEN = 5 - GAP, HALF = LEN / 2;
const BAND_BOTTOM = 1.64, BAND_TOP = 2.5, WINDOW_SILL = 1.7, WINDOW_HEAD = 2.44;
const BAY_WALL_TOP = 1.3, ENGINE_ROOM_TOP = 2.32, FLOOR_TOP = .7, CAB_BACK = .5, BAY_FRONT = -.5;
const P = (role, x0, y0, z0, x1, y1, z1, o = {}) => ({ role, box: [x0, y0, z0, x1, y1, z1], ...o });
const mirrored = p => ({ ...p, box: [-p.box[3], p.box[1], p.box[2], -p.box[0], p.box[4], p.box[5]] });
const turned = p => ({ ...p, box: [p.box[0], p.box[1], -p.box[5], p.box[3], p.box[4], -p.box[2]] });
const sides = (ps, p) => ps.push(p, mirrored(p));
const ends = (ps, p) => ps.push(p, turned(p));

/** A slab hw half-wide whose top long edges, and the chosen ends, are rounded by r, in steps of step. */
function roundedSlab(ps, role, hw, y0, y1, back, front, { rFront = false, rBack = false, r = 4 / 32, step } = {}) {
  if (!step) { ps.push(P(role, -hw, y0, back, hw, y1, front)); return; }
  const n = Math.round(r / step);
  ps.push(P(role, -hw, y0, back, hw, y1 - r, front));
  for (let j = 0; j < n; j++) {
    const lo = y1 - r + j * step, dy = (j + .5) * step;
    const inset = r - Math.round(Math.sqrt(Math.max(0, r * r - dy * dy)) / step) * step;
    ps.push(P(role, -hw + inset, lo, back + (rBack ? inset : 0), hw - inset, lo + step + 1e-4, front - (rFront ? inset : 0)));
  }
}

/** A tank along z, circular across, of radius rad about y = cy, in rows step high; flat-sided over [beltLo, beltHi]. */
function steppedTank(ps, role, rad, cy, z0, z1, step, belt) {
  let row = null;
  for (let y = cy - rad; y < cy + rad - 1e-9; y += step) {
    const dy = y + step / 2 - cy;
    let hw = Math.round(Math.sqrt(Math.max(0, rad * rad - dy * dy)) / step) * step;
    if (belt && y + step > belt[0] && y < belt[1]) hw = Math.max(hw, belt[2]);
    if (hw <= 0) continue;
    if (row && Math.abs(row.hw - hw) < 1e-9) row.y1 = y + step;
    else { if (row) ps.push(P(role, -row.hw, row.y0, z0, row.hw, row.y1, z1)); row = { hw, y0: y, y1: y + step }; }
  }
  if (row) ps.push(P(role, -row.hw, row.y0, z0, row.hw, row.y1, z1));
}

function shell(len) {
  const h = len / 2, ps = [];
  sides(ps, P('DARK_RUST', .17, 0, -h + .01, .49, .62, h - .01));
  ps.push(P('SHELL', -1, .55, -h, 1, FLOOR_TOP, h));
  return ps;
}

function locomotive(geo, kind) {
  const step = geo === 'half' ? 1 / 32 : geo === 'fine' ? 1 / 128 : 0;
  const half = HALF, wBack = CAB_BACK + .45, wFront = half - .16;
  const ps = shell(LEN);
  roundedSlab(ps, 'ROOF', 1, 2.6, 2.75, CAB_BACK, half, { rFront: true, step });
  sides(ps, P('SHELL', .92, .68, CAB_BACK + .015, .99, WINDOW_SILL - .005, half - .06));
  sides(ps, P('SHELL', .92, WINDOW_HEAD + .005, CAB_BACK + .015, .99, 2.62, half - .06));
  sides(ps, P('SHELL', .925, BAND_BOTTOM + .05, CAB_BACK + .02, .985, BAND_TOP - .05, wBack + .005));
  sides(ps, P('SHELL', .925, BAND_BOTTOM + .05, wFront - .005, .985, BAND_TOP - .05, half - .065));
  sides(ps, P('TRIM', .97, BAND_BOTTOM, CAB_BACK, 1, BAND_TOP, wBack));
  sides(ps, P('TRIM', .97, BAND_BOTTOM, wFront, 1, BAND_TOP, half));
  sides(ps, P('TRIM', .972, BAND_BOTTOM + .005, wBack - .005, .998, WINDOW_SILL, wFront + .005));
  sides(ps, P('TRIM', .972, WINDOW_HEAD, wBack - .005, .998, BAND_TOP - .005, wFront + .005));
  ps.push(P('SHELL', -.95, .67, CAB_BACK + .01, .95, 2.63, CAB_BACK + .08));
  ps.push(P('DARK_RUST', -.25, .75, CAB_BACK, .25, 2.35, CAB_BACK + .03));
  sides(ps, P('TRIM', .8, .66, half - .14, .995, 2.64, half - .015));
  ps.push(P('TRIM', -.99, 2.45, half - .05, .99, 2.65, half - .005));
  ps.push(P('TRIM', -.81, .65, half - .12, .81, 1.6, half - .02));
  const nose = kind === 'electric' ? 'COPPER' : 'DEEP_RED';
  if (step) { // a nose rounded under its band, in steps
    roundedSlab(ps, nose, 1, .72, 1.45, half - .2, half - .01, { rFront: true, step });
    const chin = [];
    roundedSlab(chin, 'DARK_RUST', .99, .4, .72 + 4 / 32, half - .3, half - .02, { rFront: true, step });
    chin.forEach(p => ps.push({ ...p, box: [p.box[0], 1.2 - p.box[4], p.box[2], p.box[3], 1.2 - p.box[1], p.box[5]] }));
  } else ps.push(P(nose, -1, .72, half - .04, 1, 1.45, half - .01));
  sides(ps, P('LAMP', .72, 1.1, half - .025, .86, 1.3, half, { fit: true }));
  // The Engine room.
  ps.push(P('ENGINE', -.95, .69, BAY_FRONT, .95, 2.2, CAB_BACK - .005));
  roundedSlab(ps, 'ROOF', .99, ENGINE_ROOM_TOP - .15, ENGINE_ROOM_TOP, BAY_FRONT - .02, CAB_BACK + .005, { rBack: true, step });
  if (!step) {
    for (let z = BAY_FRONT + .2; z + .12 < CAB_BACK - .1; z += .3) sides(ps, P('LOUVRE', .94, 1.2, z, .97, 2.05, z + .12));
  } else if (kind === 'electric') { // coil grilles that glow while it holds charge
    sides(ps, P('COIL', .95, 1.05, -.38, .975, 2.05, .38, { fit: true }));
  } else { // a firebox door that glows while it holds fuel, louvres over it, and a stack
    for (let z = BAY_FRONT + .2; z + .12 < CAB_BACK - .1; z += .3) sides(ps, P('LOUVRE', .94, 1.65, z, .97, 2.05, z + .12));
    sides(ps, P('FIREBOX', .955, .9, -.28, .99, 1.5, .28, { fit: true }));
    ps.push(P('STACK', -.13, ENGINE_ROOM_TOP - .01, -.13, .13, 2.66, .13));
    ps.push(P('STACK', -.16, 2.62, -.16, .16, 2.74, .16));
  }
  sides(ps, P('DARK_RUST', .945, .75, BAY_FRONT + .1, .98, 1.1, CAB_BACK - .1));
  // The bay.
  sides(ps, P('SHELL', .925, .685, -half + .015, .985, BAY_WALL_TOP, BAY_FRONT + .02));
  ps.push(P('SHELL', -.95, .69, -half + .01, .95, BAY_WALL_TOP - .01, -half + .07));
  sides(ps, P('TRIM', .91, BAY_WALL_TOP - .005, -half, 1, BAY_WALL_TOP + .08, BAY_FRONT + .03));
  ps.push(P('TRIM', -.995, BAY_WALL_TOP - .015, -half + .005, .995, BAY_WALL_TOP + .075, -half + .065));
  return ps;
}

function cargo(geo) {
  const step = geo === 'half' ? 1 / 32 : geo === 'fine' ? 1 / 128 : 0;
  const half = HALF, ps = shell(LEN), RECESS = .23, AT = [-1, 0, 1];
  roundedSlab(ps, 'ROOF', 1, 2.6, 2.75, -half, half, { step });
  sides(ps, P('TRIM', .97, BAND_BOTTOM, -half, 1, BAND_TOP, half));
  ends(ps, P('SHELL', -.95, .67, half - .08, .95, 2.63, half - .01));
  ends(ps, P('DARK_RUST', -.25, .75, half - .03, .25, 2.35, half));
  sides(ps, P('SHELL', .83, .68, -half + .015, .89, 2.62, half - .015));
  const edges = [-half + .02];
  AT.forEach(a => edges.push(a - RECESS + .01, a + RECESS - .01));
  edges.push(half - .02);
  for (let i = 0; i < edges.length; i += 2) sides(ps, P('SHELL', .88, .665, edges[i], .99, 2.635, edges[i + 1]));
  for (const a of AT) {
    sides(ps, P('SHELL', .882, 1.48, a - RECESS, .988, 2.625, a + RECESS));
    sides(ps, P('SHELL', .882, .675, a - RECESS, .988, 1.07, a + RECESS));
    sides(ps, P(step ? 'CRATE' : 'CHEST', .55, 1.075, a - .195, .94, 1.465, a + .195, { fit: true }));
  }
  return ps;
}

function fluid(geo) {
  const step = geo === 'half' ? 1 / 32 : geo === 'fine' ? 1 / 128 : 0;
  const half = HALF, ps = shell(LEN), g = .4;
  if (step) {
    steppedTank(ps, 'TANK', .93, 1.65, -half + .07, half - .07, step, [1.08, 2.22, .93]);
    ps.push(P('TANK', -.15, 2.5, -.2, .15, 2.72, .2)); // the dome
    for (const z of [half - .5, -half + .44]) {
      const ring = [];
      steppedTank(ring, 'TRIM', .95, 1.65, z, z + .06, step, [1.08, 2.22, .95]);
      ps.push(...ring);
    }
  } else {
    ps.push(P('TANK', -.95, 1, -half + .07, .95, 2.3, half - .07));
    ps.push(P('TANK', -.7, .72, -half + .06, .7, 2.58, half - .06));
    ps.push(P('TANK', -.15, 2.57, -.2, .15, 2.72, .2));
    ends(ps, P('TRIM', -.96, .99, half - .5, .96, 2.31, half - .44));
  }
  ends(ps, P('DARK_RUST', -.8, .69, half - .35, .8, .8, half - .2));
  sides(ps, P('TRIM', .94, 1.08, -g - .04, .96, 2.22, g + .04));
  sides(ps, P('GLASS', .945, 1.12, -g, .965, 2.18, g));
  sides(ps, P('FLUID', .966, 1.12, -g, .968, 1.12 + .62 * 1.06, g)); // a tank 62% full
  return ps;
}

// ---------------------------------------------------------------- the scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc8ef);
scene.fog = new THREE.Fog(0x9fc8ef, 60, 140);
const camera = new THREE.PerspectiveCamera(50, 1, .05, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Ground: a 16 px grass-ish noise, so the eye has a texel grid to compare against.
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 16;
  const x = cv.getContext('2d');
  for (let i = 0; i < 256; i++) { const v = 0.85 + Math.random() * .3; x.fillStyle = `rgb(${96 * v | 0},${140 * v | 0},${64 * v | 0})`; x.fillRect(i % 16, i / 16 | 0, 1, 1); }
  const t = new THREE.CanvasTexture(cv); t.magFilter = t.minFilter = THREE.NearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(200, 200); t.colorSpace = THREE.SRGBColorSpace;
  const g = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshBasicMaterial({ map: t }));
  g.rotation.x = -Math.PI / 2; g.position.y = -.001; scene.add(g);
}

const SEGMENTS = 3, FLANGE_Y = SEGMENTS, RIDE_Y = FLANGE_Y + .15;
// The Line: a straight leg along z, then a Span curving round to run along x.
const STRAIGHT = [[0, -19], [0, 11]];
const CURVE = [[0, 11], [0, 17], [6, 23], [12, 23]];
const ARMS = [[0, -19], [0, -9], [0, 1], [0, 11], [12, 23]];
function curvePoints() {
  const pts = [];
  for (let z = STRAIGHT[0][1]; z < STRAIGHT[1][1]; z += .5) pts.push([0, z]);
  const [a, b, cc, d] = CURVE;
  for (let i = 0; i <= 40; i++) {
    const t = i / 40, u = 1 - t;
    pts.push([0, 1, 2].slice(0, 2).map(k => u * u * u * a[k] + 3 * u * u * t * b[k] + 3 * u * t * t * cc[k] + t * t * t * d[k]));
  }
  return pts;
}
const PATH = curvePoints();

let world = new THREE.Group();
function build() {
  scene.remove(world);
  world.traverse(o => o.geometry?.dispose());
  world = new THREE.Group(); scene.add(world);
  const geo = GEOS[state.geo][0], look = LOOK[LOOKS[state.look][0]];
  const add = (parts, group, density = 16, off) => parts.forEach(p => group.add(meshOf(p, look, density, off)));

  // Pylons, the top segment carrying the Arm.
  for (const [x, z] of ARMS) {
    const g = new THREE.Group(); g.position.set(x, 0, z);
    const ps = [];
    for (let y = 0; y < SEGMENTS; y++) ps.push(P('PYLON', -3 / 16, y, -3 / 16, 3 / 16, y + 1, 3 / 16));
    if (geo !== 'placeholder') {
      ps.push(P('CAP', -6 / 16, SEGMENTS - 5 / 16, -6 / 16, 6 / 16, SEGMENTS - 1 / 16, 6 / 16));
      ps.push(P('PLATE', -5 / 16, SEGMENTS - 1 / 16, -5 / 16, 5 / 16, SEGMENTS, 5 / 16));
      ps.push(P('CAP', -5 / 16, 0, -5 / 16, 5 / 16, 2 / 16, 5 / 16));
    }
    add(ps, g, 16, [.5, 0, .5]); world.add(g); // the post's texture is its model's, pixels 5 to 11
  }
  // The Rail, an inverted T swept along the Line, its texture running on along it.
  let s = 0;
  for (let i = 0; i + 1 < PATH.length; i++) {
    const [ax, az] = PATH[i], [bx, bz] = PATH[i + 1];
    const len = Math.hypot(bx - ax, bz - az), g = new THREE.Group();
    g.position.set((ax + bx) / 2, FLANGE_Y, (az + bz) / 2);
    g.rotation.y = Math.atan2(bx - ax, bz - az);
    const h = len / 2 + .01, off = [0, 0, s + h];
    add([P('FLANGE', -.45, 0, -h, .45, .15, h), P('WEB', -.15, .15, -h, .15, .65, h, { top: 'RAILTOP' })], g, 16, off);
    world.add(g); s += len;
  }
  // The Train on the straight leg: a Burner Locomotive leading, an Electric one facing out at the back.
  const cars = [['burner', 6.5, false], ['cargo', 1.5, false], ['fluid', -3.5, false], ['electric', -8.5, true]];
  for (const [kind, z, back] of cars) {
    const g = new THREE.Group(); g.position.set(0, RIDE_Y, z); if (back) g.rotation.y = Math.PI;
    const ps = kind === 'cargo' ? cargo(geo) : kind === 'fluid' ? fluid(geo) : locomotive(geo, kind);
    add(ps, g, state.px); g.name = kind; world.add(g);
  }
  // A platform deck two blocks off the Rail, its blocks beside the cars they serve.
  const deck = new THREE.Group(); deck.position.set(0, 0, 0);
  const dps = [P('DECK', 1.5, FLANGE_Y, -13, 3.5, FLANGE_Y + 1, 12)];
  for (const z of [-13, -1, 11]) dps.push(P('DECK', 2, 0, z, 3, FLANGE_Y, z + 1));
  add(dps, deck); world.add(deck);
  const blockSet = BLOCKS[look.blocks];
  const placed = [['station', 10], ['hatch_provider', 6], ['hatch_requester', 1], ['fluid_provider', -4],
    ['fluid_requester', -6], ['charger', -9], ['generator', -10], ['creative', -12]];
  for (const [name, z] of placed) {
    const faces = blockSet[name];
    const g = boxGeometry([1.5, FLANGE_Y + 1, z, 2.5, FLANGE_Y + 2, z + 1], { fit: true });
    world.add(new THREE.Mesh(g, faces.map(f => material(f, 16))));
  }
  // The Fluid hatches' Sight glasses, after SightGlassFill.roundWindow: a provider of water, a requester of lava, rings orange and blue as today.
  sightGlasses(-4, .62, [.23, .44, .85], [1, .6, .3], look.blocks === 'riley');
  sightGlasses(-6, .3, [1, .45, .1], [.35, .55, 1], look.blocks === 'riley');
}

const WINDOW = [[6, 5, 10, 6], [5, 6, 11, 7], [5, 7, 11, 8], [5, 8, 11, 9], [5, 9, 11, 10], [6, 10, 10, 11]];
const RING = [[6, 4, 10, 5], ...WINDOW.map(([l, b, r, t]) => [l - 1, b, r + 1, t]), [6, 11, 10, 12]];
/** Each side's round window on the Fluid hatch at block z: the fluid up to full, and, where the texture has none, the ring and glass. */
function sightGlasses(z, full, fluidColour, ringColour, drawWindow) {
  const lo = WINDOW[0][1], hi = WINDOW[WINDOW.length - 1][3], surface = lo + (hi - lo) * full;
  const fill = WINDOW.filter(r => r[1] < surface).map(([l, b, r, t]) => [l, b, r, Math.min(t, surface)]);
  const layers = [[fill, { flat: fluidColour, glow: true }, .003]];
  if (drawWindow) layers.push([RING, ringColour, .001], [WINDOW, PAINT.GLASS, .002]);
  const x0 = 1.5, y0 = FLANGE_Y + 1;
  for (const [rects, spec, d] of layers) {
    for (const [l, b, r, t] of rects) {
      const y = [y0 + b / 16, y0 + t / 16];
      const boxes = [
        [2.5, y[0], z + l / 16, 2.5 + d, y[1], z + r / 16], [x0 - d, y[0], z + l / 16, x0, y[1], z + r / 16],
        [x0 + l / 16, y[0], z + 1, x0 + r / 16, y[1], z + 1 + d], [x0 + l / 16, y[0], z - d, x0 + r / 16, y[1], z],
      ];
      for (const bx of boxes) world.add(new THREE.Mesh(boxGeometry(bx, { fit: true }), material(spec, 16)));
    }
  }
}

const VIEWS = { // [target, offset from it]
  train: [[0, 4, -1], [-16, 7, 14]], burner: [[0, 4.5, 6.5], [-6.5, 2.5, 5.5]], electric: [[0, 4.5, -8.5], [-6, 2.5, -5]],
  cargo: [[0, 4.5, 1.5], [-6.5, 1.5, 3]], fluid: [[0, 4.5, -3.5], [-6.5, 1.5, 2]], track: [[3, 2.5, 14], [-10, 4, 6]],
  blocks: [[2, 4.5, -1], [8, 3, 7]], power: [[2, 4.5, -10], [7, 3, -3]],
};
let tween = null;
function aim(instant) {
  const [t, o] = VIEWS[FOCI[state.focus][0]];
  const target = new THREE.Vector3(...t), pos = target.clone().add(new THREE.Vector3(...o));
  if (instant) { controls.target.copy(target); camera.position.copy(pos); return; }
  tween = { t0: performance.now(), fromT: controls.target.clone(), fromP: camera.position.clone(), target, pos };
}

// ---------------------------------------------------------------- the bar
function sync(rebuild) {
  document.getElementById('focus').textContent = FOCI[state.focus][1];
  document.getElementById('geo').textContent = GEOS[state.geo][1];
  document.getElementById('look').textContent = LOOKS[state.look][1];
  document.getElementById('px').textContent = state.px + 'px';
  const p = new URLSearchParams({ focus: FOCI[state.focus][0], geo: GEOS[state.geo][0], look: LOOKS[state.look][0], px: state.px });
  try { history.replaceState(null, '', '?' + p); } catch {} // not from a data: or file: page
  if (rebuild) build();
}
const LISTS = { focus: FOCI, geo: GEOS, look: LOOKS };
function step(k, d) {
  state[k] = (state[k] + d + LISTS[k].length) % LISTS[k].length;
  sync(k !== 'focus'); if (k === 'focus') aim(false);
}
document.querySelectorAll('#bar button').forEach(b => b.onclick = () => step(b.dataset.k, +b.dataset.d));
document.getElementById('px').onclick = () => { state.px = state.px === 32 ? 16 : 32; sync(true); };
document.getElementById('q').onclick = () => { const h = document.getElementById('help'); h.style.display = h.style.display === 'block' ? 'none' : 'block'; };
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  const k = { ArrowLeft: ['look', -1], ArrowRight: ['look', 1], ArrowUp: ['geo', -1], ArrowDown: ['geo', 1], '[': ['focus', -1], ']': ['focus', 1] }[e.key];
  if (k) { e.preventDefault(); step(...k); }
  else if (e.key === 'd' || e.key === 'D') { state.px = state.px === 32 ? 16 : 32; sync(true); }
});

function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
sync(true); aim(true);

let tick = 0;
renderer.setAnimationLoop(now => {
  if (tween) {
    const k = Math.min(1, (now - tween.t0) / 700), e = k * k * (3 - 2 * k);
    controls.target.lerpVectors(tween.fromT, tween.target, e); camera.position.lerpVectors(tween.fromP, tween.pos, e);
    if (k === 1) tween = null;
  }
  const f = Math.floor(now / 150); if (f !== tick) { tick = f; animated.forEach(a => drawFrame(a, f)); }
  controls.update(); renderer.render(scene, camera);
});
</script>
